<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能数学工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🧮 多功能数学工具</h1>
        
        <div class="menu">
            <button class="menu-btn active" data-mode="gcd">📐 GCD</button>
            <button class="menu-btn" data-mode="lcm">📏 LCM</button>
            <button class="menu-btn" data-mode="prime">🔢 质数</button>
            <button class="menu-btn" data-mode="modpow">⚡ 模幂</button>
            <button class="menu-btn" data-mode="equation">📝 不定方程</button>
            <button class="menu-btn" data-mode="calc">🧮 计算器</button>
        </div>
        
        <div class="content">
            <!-- GCD -->
            <div id="gcdMode" class="mode-content">
                <div class="input-group">
                    <label>请输入整数（用空格分隔）：</label>
                    <input type="text" id="gcdInput" placeholder="例如：12 18 24" value="12 18 24">
                </div>
                <button class="calc-btn" onclick="calculateGCD()">计算最大公约数</button>
            </div>
            
            <!-- LCM -->
            <div id="lcmMode" class="mode-content hidden">
                <div class="input-group">
                    <label>请输入整数（用空格分隔）：</label>
                    <input type="text" id="lcmInput" placeholder="例如：3 4 5" value="3 4 5">
                </div>
                <button class="calc-btn" onclick="calculateLCM()">计算最小公倍数</button>
            </div>
            
            <!-- 质数 -->
            <div id="primeMode" class="mode-content hidden">
                <div class="input-group">
                    <label>请输入整数（用空格分隔）：</label>
                    <input type="text" id="primeInput" placeholder="例如：7 11 13 4" value="7 11 13 4">
                </div>
                <button class="calc-btn" onclick="calculatePrime()">判断质数</button>
                <div class="help-text">💡 单个数字：判断是否为质数<br>多个数字：筛选出其中的质数</div>
            </div>
            
            <!-- 模幂 -->
            <div id="modpowMode" class="mode-content hidden">
                <div class="input-group">
                    <label>计算 n^m ≡ x (mod b)</label>
                    <div style="display: flex; gap: 8px; margin-top: 8px;">
                        <input type="text" id="modpowN" placeholder="底数 n" value="3" style="flex:1;">
                        <span style="align-self:center;">^</span>
                        <input type="text" id="modpowM" placeholder="指数 m" value="5" style="flex:1;">
                        <span style="align-self:center;">mod</span>
                        <input type="text" id="modpowB" placeholder="模数 b" value="7" style="flex:1;">
                    </div>
                </div>
                <button class="calc-btn" onclick="calculateModPow()">计算模幂</button>
                <div class="help-text">
                    💡 求 n 的 m 次方除以 b 的余数<br>
                    示例：3^5 mod 7 = 5
                </div>
            </div>
            
            <!-- 不定方程 -->
            <div id="equationMode" class="mode-content hidden">
                <div class="input-group">
                    <label>请输入二元一次不定方程：</label>
                    <input type="text" id="equationInput" placeholder="例如：3x + 5y = 7" value="3x + 5y = 7">
                </div>
                <button class="calc-btn" onclick="calculateEquation()">求解不定方程</button>
                <div class="help-text">💡 支持格式：ax + by = c<br>示例：3x + 5y = 7, 2x - 4y = 6</div>
            </div>
            
            <!-- 计算器 -->
            <div id="calcMode" class="mode-content hidden">
                <div class="input-group">
                    <label>请输入数学表达式：</label>
                    <textarea id="calcInput" placeholder="例如：3 + 5 * 2">3 + 5 * 2</textarea>
                </div>
                <button class="calc-btn" onclick="calculateExpression()">计算</button>
                <div class="help-text">💡 支持：+ - * / ( ) 小数 负数</div>
            </div>
        </div>
        
        <div class="result-box">
            <div class="label">计算结果</div>
            <div class="value" id="resultValue">等待计算...</div>
        </div>
        
        <div class="status-bar" id="statusBar">✅ 就绪</div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
